<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sunrise Dental Clinic</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;

            border-radius: 12px;

            box-shadow:
                    0 5px 20px
                    rgba(0,0,0,0.10);

            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            background: #0f3d56;
            color: white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            color: #0f3d56;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .login-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-button {
            display: block;

            padding: 14px;

            border-radius: 7px;

            text-decoration: none;

            font-weight: bold;
            font-size: 15px;

            transition: 0.2s;
        }

        .admin {
            background: #0f3d56;
            color: white;
        }

        .admin:hover {
            background: #0a2d40;
        }

        .user {
            background: #159a9c;
            color: white;
        }

        .user:hover {
            background: #117779;
        }

        footer {
            margin-top: 25px;

            color: #6b7280;

            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            SD
        </div>

        <h1>
            Sunrise Dental Clinic
        </h1>

        <p class="subtitle">
            Dental Clinic Management System
        </p>

        <div class="login-buttons">

            <a href="login?type=admin"
               class="login-button admin">
                Admin Login
            </a>

            <a href="login?type=user"
               class="login-button user">
                User Login
            </a>

        </div>

        <footer>
            © 2026 Sunrise Dental Clinic
        </footer>

    </div>

</div>

</body>
</html>
